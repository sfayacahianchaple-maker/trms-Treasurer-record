<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Treasurer Dashboard</title>
    <link rel="icon" type="image/png" href="assets/logo.png" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-role="zone_treasurer" class="app-shell">
    <header class="topbar">
      <div class="brand">TRMS</div>
      <div class="topbar-meta">
        <span class="user-chip" data-user-name>Zone Treasurer</span>
        <button class="btn btn-secondary" data-logout>Logout</button>
      </div>
    </header>

    <div class="layout">
      <aside class="sidebar">
        <div class="sidebar-brand" aria-label="TRMS brand">
          <img class="sidebar-brand__img" src="assets/logo.png" alt="TRMS logo" />
          <span class="sidebar-brand__text">TRMS</span>
        </div>
        <ul class="nav-list">
          <li><a class="active" href="treasurer-dashboard.html">Dashboard</a></li>
          <li><a href="treasurer-members.html">My Members</a></li>
          <li><a href="treasurer-payments.html">Payment Management</a></li>
        </ul>
      </aside>

      <main class="content">
        <div class="page-header">
          <h1>Treasurer Dashboard</h1>
        </div>

        <section class="card">
          <h2 id="welcomeTitle">Welcome</h2>
          <div class="zone-header">
            <div>
              <p><strong>Assigned Zone:</strong> <span id="assignedZoneLabel">-</span></p>
            </div>
          </div>

          <div class="metrics-grid grid" id="treasurerMetrics"></div>
        </section>
      </main>
    </div>

    <script src="js/config.js"></script>
    <script src="js/auth.js?v=20260926-3"></script>
    <script src="js/utils.js?v=20260925-1"></script>
    <script src="js/guard.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', async () => {
        await window.TRMSAuth.ready();
        const user = window.TRMSAuth.getCurrentUser();
        const zoneId = user?.zone_id;
        const data = window.TRMSAuth.getMockData();
        const zone = data.zones.find((item) => Number(item.id) === Number(zoneId));
        document.getElementById('welcomeTitle').textContent = `Welcome, ${user.name}`;
        document.getElementById('assignedZoneLabel').textContent = zone ? zone.name : 'Not assigned';

        const statusYear = Number(data.monthlyDue?.year || new Date().getFullYear());
        const memberList = data.members.filter((member) =>
          Number(member.zone_id) === Number(zoneId) && window.TRMSUtils.memberStartedByYear(member, statusYear)
        );
        const memberStatuses = new Map(memberList.map((member) => [
          member.id,
          window.TRMSUtils.calculateMemberStatus(member.id, statusYear)
        ]));
        const monthlySettings = (data.monthlyDueSettings || []).find((setting) => Number(setting.year) === statusYear) || data.monthlyDue || {};
        const monthlyPaid = data.monthlyPayments
          .filter((payment) => memberList.some((member) => Number(member.id) === Number(payment.member_id)) && Number(payment.year) === statusYear && payment.paid)
          .reduce((sum, payment) => sum + Number(payment.amount || 0), 0);
        const monthlyObligation = memberList.length * Number(monthlySettings.yearly_due || (Number(monthlySettings.monthly_amount || 0) * 12));
        const monthlyUnpaid = Math.max(monthlyObligation - monthlyPaid, 0);
        const additionalPaid = data.additionalFeePayments
          .filter((payment) => memberList.some((member) => Number(member.id) === Number(payment.member_id)) && Number(payment.year) === statusYear && payment.paid)
          .reduce((sum, payment) => sum + Number(payment.amount || 0), 0);
        const additionalUnpaid = data.additionalFees
          .filter((fee) => Number(fee.year) === statusYear)
          .reduce((sum, fee) => sum + Number(fee.amount || 0) * memberList.length, 0) - additionalPaid;
        const metrics = document.getElementById('treasurerMetrics');
        metrics.innerHTML = [
          { label: 'Total Members', value: memberList.length },
          { label: 'Active Members', value: memberList.filter((member) => memberStatuses.get(member.id)?.label === 'Active') .length, className: 'active-summary' },
          { label: 'Inactive Members', value: memberList.filter((member) => memberStatuses.get(member.id)?.label !== 'Active').length, className: 'inactive-summary' },
          { label: 'Monthly Due Paid', value: window.TRMSUtils.formatMoneyShort(monthlyPaid), className: 'monthly-card' },
          { label: 'Monthly Due Unpaid', value: window.TRMSUtils.formatMoneyShort(monthlyUnpaid), className: 'monthly-card' },
          { label: 'Additional Fees Paid', value: window.TRMSUtils.formatMoneyShort(additionalPaid), className: 'fee-card' },
          { label: 'Additional Fees Unpaid', value: window.TRMSUtils.formatMoneyShort(Math.max(additionalUnpaid, 0)), className: 'fee-card' },
          { label: 'Total Paid', value: window.TRMSUtils.formatMoneyShort(monthlyPaid + additionalPaid), className: 'paid-summary' },
          { label: 'Total Unpaid', value: window.TRMSUtils.formatMoneyShort(monthlyUnpaid + Math.max(additionalUnpaid, 0)), className: 'unpaid-summary' }
        ].map((metric) => `
          <article class="card metric-card ${metric.className || ''}">
            <span class="label">${metric.label}</span>
            <span class="value">${metric.value}</span>
          </article>
        `).join('');
      });
    </script>
  </body>
</html>
