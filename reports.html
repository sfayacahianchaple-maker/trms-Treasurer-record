<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reports</title>
    <link rel="icon" type="image/png" href="assets/logo.png" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-role="admin" class="app-shell">
    <header class="topbar">
      <div class="brand">TRMS</div>
      <div class="topbar-meta">
        <span class="user-chip" data-user-name>Head Treasurer</span>
        <button class="btn btn-secondary" data-logout>Logout</button>
      </div>
    </header>

    <div class="layout">
      <aside class="sidebar">
        <div class="sidebar-brand" aria-label="TRMS brand">
          <img class="sidebar-brand__img" src="assets/logo.png" alt="TRMS logo" />
          <span class="sidebar-brand__text">TRMS</span>
        </div>
        <ul class="nav-list">
          <li><a href="admin-dashboard.html">Dashboard</a></li>
          <li><a href="zones.html">Zone List</a></li>
          <li><a href="create-zone.html">Create Zone</a></li>
          <li><a href="members.html">Members</a></li>
          <li><a href="treasurers.html">Zone Treasurers</a></li>
          <li><a href="monthly-due.html">Monthly Due</a></li>
          <li><a href="additional-fees.html">Additional Fees</a></li>
          <li><a href="payment-records.html">Payment Records</a></li>
          <li><a class="active" href="reports.html">Reports</a></li>
        </ul>
      </aside>

      <main class="content">
        <div class="page-header page-header--split">
          <div>
            <p class="eyebrow">Overview</p>
            <h1>Reports <span id="reportYearTitle"></span></h1>
          </div>
          <div class="button-group">
            <label class="inline-controls" for="reportYearSelect">
              <span>Year</span>
              <select id="reportYearSelect"></select>
            </label>
            <button type="button" class="btn btn-primary" id="printReportsBtn">Print Reports</button>
          </div>
        </div>

        <section class="grid metrics-grid" id="reportMetrics"></section>
      </main>
    </div>

    <script src="js/config.js"></script>
    <script src="js/auth.js?v=20260917-9"></script>
    <script src="js/utils.js?v=20260925-1"></script>
    <script src="js/guard.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', async () => {
        await window.TRMSAuth.ready();
        const data = window.TRMSAuth.getMockData();
        const metrics = document.getElementById('reportMetrics');
        const yearSelect = document.getElementById('reportYearSelect');
        const reportYears = [...new Set([
          ...(data.monthlyDueSettings || []).map((setting) => Number(setting.year)),
          ...(data.additionalFees || []).map((fee) => Number(fee.year)),
          ...(data.monthlyPayments || []).map((payment) => Number(payment.year)),
          ...(data.additionalFeePayments || []).map((payment) => Number(payment.year))
        ].filter((year) => Number.isInteger(year)))].sort((first, second) => second - first);
        yearSelect.innerHTML = reportYears.length
          ? reportYears.map((year) => `<option value="${year}">${year} Reports</option>`).join('')
          : '<option value="" disabled selected>No reports available</option>';
        yearSelect.disabled = reportYears.length === 0;
        if (reportYears.includes(new Date().getFullYear())) {
          yearSelect.value = String(new Date().getFullYear());
        }

        function updateReportYearTitle() {
          document.getElementById('reportYearTitle').textContent = yearSelect.value ? ` ${yearSelect.value}` : '';
        }

        function getReport(year) {
          const yearMembers = data.members.filter((member) => window.TRMSUtils.memberStartedByYear(member, year));
          const totalMembers = yearMembers.length;
          const memberStatuses = yearMembers.map((member) => window.TRMSUtils.calculateMemberStatus(member.id, year));
          const activeMembers = memberStatuses.filter((status) => status.label === 'Active').length;
          const monthlyPaid = data.monthlyPayments
            .filter((payment) => Number(payment.year) === year && payment.paid)
            .reduce((sum, payment) => sum + Number(payment.amount || 0), 0);
          const monthlySettings = (data.monthlyDueSettings || []).find((setting) => Number(setting.year) === year) || data.monthlyDue || {};
          const yearPerMember = Number(monthlySettings.yearly_due || (Number(monthlySettings.monthly_amount || 0) * 12));
          const monthlyObligation = totalMembers * yearPerMember;
          const paidMonthlyAmount = data.monthlyPayments
            .filter((payment) => Number(payment.year) === year && payment.paid)
            .reduce((sum, payment) => sum + Number(payment.amount || 0), 0);
          const monthlyUnpaidAmount = Math.max(monthlyObligation - paidMonthlyAmount, 0);
          const feeRows = data.additionalFees.filter((fee) => Number(fee.year) === year);
          const feePaid = data.additionalFeePayments
            .filter((payment) => Number(payment.year) === year && payment.paid)
            .reduce((sum, payment) => sum + Number(payment.amount || 0), 0);
          const feeObligation = feeRows.reduce((sum, fee) => sum + Number(fee.amount || 0), 0) * totalMembers;
          const feeUnpaid = Math.max(feeObligation - feePaid, 0);
          return {
            year,
            activeMembers,
            inactiveMembers: totalMembers - activeMembers,
            monthlyPaid,
            monthlyUnpaid: monthlyUnpaidAmount,
            feePaid,
            feeUnpaid
          };
        }

        function renderReport() {
          const report = getReport(Number(yearSelect.value));
          updateReportYearTitle();
          const cards = [
            { label: 'Total Members', value: totalMembers },
            { label: 'Active Users', value: report.activeMembers, className: 'active-summary' },
            { label: 'Inactive Users', value: report.inactiveMembers, className: 'inactive-summary' },
            { label: 'Monthly Due Paid', value: window.TRMSUtils.formatMoneyShort(report.monthlyPaid), className: 'monthly-card' },
            { label: 'Monthly Due Unpaid', value: window.TRMSUtils.formatMoneyShort(report.monthlyUnpaid), className: 'monthly-card' },
            { label: 'Additional Fees Paid', value: window.TRMSUtils.formatMoneyShort(report.feePaid), className: 'fee-card' },
            { label: 'Additional Fees Unpaid', value: window.TRMSUtils.formatMoneyShort(report.feeUnpaid), className: 'fee-card' }
          ];
          metrics.innerHTML = cards.map((card) => `
            <article class="card metric-card ${card.className || ''}">
              <span class="label">${card.label}</span>
              <span class="value">${card.value}</span>
            </article>
          `).join('');
          return report;
        }

        yearSelect.addEventListener('change', renderReport);
        document.getElementById('printReportsBtn').addEventListener('click', () => {
          const report = getReport(Number(yearSelect.value));
          const printWindow = window.open('', '_blank', 'width=900,height=700');
          if (!printWindow) {
            alert('Popup blocked. Please allow pop-ups to print the report.');
            return;
          }
          printWindow.document.write(`
            <html>
              <head>
                <title>${report.year} Financial Report</title>
                <style>
                  @page { size: A4 portrait; margin: 0; }
                  html, body { width: 210mm; min-height: 297mm; }
                  body { box-sizing: border-box; padding: 14mm; font-family: Arial, sans-serif; color: #1b241f; }
                  h1 { text-align: center; margin: 0 0 8px; }
                  p { text-align: center; margin: 0 0 28px; color: #5c655d; }
                  table { width: 100%; border-collapse: collapse; }
                  th, td { border: 1px solid #c7bea5; padding: 12px; text-align: left; }
                  th { background: #f1ede1; }
                  td:last-child { text-align: right; }
                </style>
              </head>
              <body>
                <h1>TRMS FINANCIAL REPORT</h1>
                <p>${report.year} Report</p>
                <table>
                  <thead><tr><th>Category</th><th>Amount</th></tr></thead>
                  <tbody>
                    <tr><td>Total Members</td><td>${totalMembers}</td></tr>
                    <tr><td>Active Users</td><td>${report.activeMembers}</td></tr>
                    <tr><td>Inactive Users</td><td>${report.inactiveMembers}</td></tr>
                    <tr><td>Monthly Due Paid</td><td>${window.TRMSUtils.formatMoneyShort(report.monthlyPaid)}</td></tr>
                    <tr><td>Monthly Due Unpaid</td><td>${window.TRMSUtils.formatMoneyShort(report.monthlyUnpaid)}</td></tr>
                    <tr><td>Additional Fees Paid</td><td>${window.TRMSUtils.formatMoneyShort(report.feePaid)}</td></tr>
                    <tr><td>Additional Fees Unpaid</td><td>${window.TRMSUtils.formatMoneyShort(report.feeUnpaid)}</td></tr>
                  </tbody>
                </table>
              </body>
            </html>
          `);
          printWindow.document.close();
          printWindow.focus();
          printWindow.print();
        });

        renderReport();
      });
    </script>
  </body>
</html>
