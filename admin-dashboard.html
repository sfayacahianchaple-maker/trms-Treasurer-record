<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard</title>
    <link rel="icon" type="image/png" href="assets/logo.png" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-role="admin" class="app-shell">
    <header class="topbar">
      <div class="brand">TRMS</div>
      <div class="topbar-meta">
        <span class="user-chip" data-user-name>Head Treasurer</span>
        <button class="btn btn-secondary" data-logout>Logout</button>
      </div>
    </header>

    <div class="layout">
      <aside class="sidebar">
        <div class="sidebar-brand" aria-label="TRMS brand">
          <img class="sidebar-brand__img" src="assets/logo.png" alt="TRMS logo" />
          <span class="sidebar-brand__text">TRMS</span>
        </div>
        <ul class="nav-list">
          <li><a class="active" href="admin-dashboard.html">Dashboard</a></li>
          <li><a href="zones.html">Zone List</a></li>
          <li><a href="create-zone.html">Create Zone</a></li>
          <li><a href="members.html">Members</a></li>
          <li><a href="treasurers.html">Zone Treasurers</a></li>
          <li><a href="monthly-due.html">Monthly Due</a></li>
          <li><a href="additional-fees.html">Additional Fees</a></li>
          <li><a href="payment-records.html">Payment Records</a></li>
          <li><a href="reports.html">Reports</a></li>
        </ul>
      </aside>

      <main class="content">
        <div class="page-header">
          <h1>Admin Dashboard <span id="dashboardYear"></span></h1>
        </div>

        <section class="grid metrics-grid" id="dashboardMetrics"></section>

        <section class="card card-spaced-top">
          <h2>Zone Summary</h2>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Zone</th>
                  <th>Treasure</th>
                  <th>Members</th>
                  <th>Active</th>
                  <th>Inactive</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody id="zoneSummaryTable"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <script src="js/config.js"></script>
    <script src="js/auth.js?v=20260917-9"></script>
    <script src="js/utils.js?v=20260925-1"></script>
    <script src="js/guard.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', async () => {
        await window.TRMSAuth.ready();
        const metrics = document.getElementById('dashboardMetrics');
        const summaryTable = document.getElementById('zoneSummaryTable');
        const data = window.TRMSAuth.getMockData();
        document.getElementById('dashboardYear').textContent = new Date().getFullYear();

        const totalZones = data.zones.length;
        const statusYear = new Date().getFullYear();
        const yearMembers = data.members.filter((member) => window.TRMSUtils.memberStartedByYear(member, statusYear));
        const totalMembers = yearMembers.length;
        const memberStatuses = new Map(yearMembers.map((member) => [
          member.id,
          window.TRMSUtils.calculateMemberStatus(member.id, statusYear)
        ]));
        const activeMembers = yearMembers.filter((member) => memberStatuses.get(member.id)?.label === 'Active').length;
        const inactiveMembers = totalMembers - activeMembers;
        const monthlyPaid = data.monthlyPayments.filter((payment) => Number(payment.year) === statusYear && payment.paid)
          .reduce((sum, payment) => sum + Number(payment.amount || 0), 0);
        const monthlySettings = (data.monthlyDueSettings || []).find((setting) => Number(setting.year) === statusYear) || data.monthlyDue || {};
        const yearPerMember = Number(monthlySettings.yearly_due || (Number(monthlySettings.monthly_amount || 0) * 12));
        const monthlyObligation = totalMembers * yearPerMember;
        const paidMonthlyAmount = data.monthlyPayments
          .filter((payment) => Number(payment.year) === statusYear && payment.paid)
          .reduce((sum, payment) => sum + Number(payment.amount || 0), 0);
        const monthlyUnpaidAmount = Math.max(monthlyObligation - paidMonthlyAmount, 0);
        const additionalPaid = data.additionalFeePayments.filter((payment) => Number(payment.year) === statusYear && payment.paid)
          .reduce((sum, payment) => sum + Number(payment.amount || 0), 0);
        const additionalUnpaid = data.additionalFeePayments.filter((payment) => Number(payment.year) === statusYear && !payment.paid)
          .reduce((sum, payment) => sum + Number(payment.amount || 0), 0);

        const cards = [
          { label: 'Total Zones', value: totalZones },
          { label: 'Total Members', value: totalMembers },
          { label: 'Active Users', value: activeMembers, className: 'active-summary' },
          { label: 'Inactive Users', value: inactiveMembers, className: 'inactive-summary' },
          { label: 'Monthly Due Paid', value: window.TRMSUtils.formatMoneyShort(monthlyPaid), className: 'monthly-card' },
          { label: 'Monthly Due Unpaid', value: window.TRMSUtils.formatMoneyShort(monthlyUnpaidAmount), className: 'monthly-card' },
          { label: 'Additional Fees Paid', value: window.TRMSUtils.formatMoneyShort(additionalPaid), className: 'fee-card' },
          { label: 'Additional Fees Unpaid', value: window.TRMSUtils.formatMoneyShort(additionalUnpaid), className: 'fee-card' },
          { label: 'Total Paid', value: window.TRMSUtils.formatMoneyShort(monthlyPaid + additionalPaid), className: 'paid-summary' },
          { label: 'Total Unpaid', value: window.TRMSUtils.formatMoneyShort(monthlyUnpaidAmount + additionalUnpaid), className: 'unpaid-summary' }
        ];

        metrics.innerHTML = cards.map((card) => `
          <article class="card metric-card ${card.className || ''}">
            <span class="label">${card.label}</span>
            <span class="value">${card.value}</span>
          </article>
        `).join('');

        summaryTable.innerHTML = data.zones.map((zone) => {
          const zoneMembers = yearMembers.filter((member) => Number(member.zone_id) === Number(zone.id));
          const zoneTreasurer = data.profiles.find((profile) => Number(profile.zone_id) === Number(zone.id) && profile.role === 'zone_treasurer');
          const activeZoneMembers = zoneMembers.filter((member) => memberStatuses.get(member.id)?.label === 'Active').length;
          return `
            <tr>
              <td>${zone.name}</td>
              <td>${zoneTreasurer ? zoneTreasurer.name : 'Unassigned'}</td>
              <td>${zoneMembers.length}</td>
              <td>${activeZoneMembers}</td>
              <td>${zoneMembers.length - activeZoneMembers}</td>
              <td><a href="zone-members.html?zoneId=${zone.id}" class="btn btn-secondary">View Record</a></td>
            </tr>
          `;
        }).join('');
      });
    </script>
  </body>
</html>
