<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Member Record</title>
    <link rel="stylesheet" href="css/style.css?v=20260916-6" />
      <link rel="icon" type="image/png" href="assets/logo.png" />
  </head>
  <body data-role="admin" class="app-shell record-page">
    <header class="topbar">
      <div class="brand">TRMS</div>
      <div class="topbar-meta">
        <span class="user-chip" data-user-name>Head Treasurer</span>
        <button class="btn btn-secondary" data-logout>Logout</button>
      </div>
    </header>

    <div class="layout">
      <aside class="sidebar">
        <div class="sidebar-brand" aria-label="TRMS brand">
          <img class="sidebar-brand__img" src="assets/logo.png" alt="TRMS logo" />
          <span class="sidebar-brand__text">TRMS</span>
        </div>
        <ul class="nav-list">
          <li><a href="admin-dashboard.html">Dashboard</a></li>
          <li><a class="active" href="zones.html">Zone List</a></li>
          <li><a href="create-zone.html">Create Zone</a></li>
          <li><a href="members.html">Members</a></li>
          <li><a href="treasurers.html">Zone Treasurers</a></li>
          <li><a href="monthly-due.html">Monthly Due</a></li>
          <li><a href="additional-fees.html">Additional Fees</a></li>
          <li><a href="payment-records.html">Payment Records</a></li>
          <li><a href="reports.html">Reports</a></li>
        </ul>
      </aside>

      <main class="content">
        <div class="page-header page-header--split">
          <div>
            <p class="eyebrow record-label">Member Record</p>
            <h1 id="memberName">Member</h1>
            <p id="memberMeta">-</p>
          </div>
          <div class="record-actions no-print">
            <a href="zones.html" class="btn btn-secondary">Back to Zone List</a>
            <div class="record-filters">
              <label for="recordYear">Year</label>
              <select id="recordYear"></select>
              <button type="button" class="btn btn-primary print-record-button" id="printReceipt">Print Receipt</button>
            </div>
          </div>
        </div>

        <section class="card record-block">
          <h2>Monthly Due</h2>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Month</th>
                  <th>Amount</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody id="monthlyRecordBody"></tbody>
            </table>
          </div>
        </section>

        <section class="card record-block card-spaced-top">
          <h2>Additional Fees</h2>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Fee</th>
                  <th>Amount</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody id="additionalRecordBody"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <script src="js/config.js"></script>
    <script src="js/auth.js?v=20260926-3"></script>
    <script src="js/utils.js"></script>
    <script src="js/guard.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', async () => {
        await window.TRMSAuth.ready();

        const params = new URLSearchParams(window.location.search);
        const memberId = Number(params.get('memberId'));
        const zoneId = Number(params.get('zoneId') || 1);
        const yearSelect = document.getElementById('recordYear');
        const requestedYear = Number(params.get('year')) || new Date().getFullYear();
        const data = window.TRMSAuth.getMockData();
        const member = data.members.find((item) => Number(item.id) === memberId);
        const zone = data.zones.find((item) => Number(item.id) === zoneId);
        const logoUrl = new URL('assets/logo.png', window.location.href).href;
        const recordYears = [...new Set((data.monthlyDueSettings || [])
          .map((setting) => Number(setting.year))
          .filter((year) => Number.isInteger(year)))].sort((first, second) => second - first);
        yearSelect.innerHTML = recordYears.length
          ? recordYears.map((year) => `<option value="${year}">${year}</option>`).join('')
          : '<option value="" disabled selected>Monthly Due Not Created</option>';
        yearSelect.disabled = recordYears.length === 0;

        if (!member) {
          document.getElementById('memberName').textContent = 'Member record not found';
          return;
        }

        if (recordYears.includes(requestedYear)) yearSelect.value = String(requestedYear);
        document.getElementById('memberName').textContent = member.name;
        document.getElementById('memberMeta').textContent = `${zone ? zone.name : 'Zone'} - ${member.address || 'No address provided'} - ${member.phone || 'No phone number'}`;

        function renderRecord() {
          const year = Number(yearSelect.value);
          const monthly = data.monthlyPayments.filter((payment) =>
            Number(payment.member_id) === memberId && Number(payment.year) === year
          );
          const additional = data.additionalFees
            .filter((fee) => Number(fee.year) === year)
            .map((fee) => {
              const payment = data.additionalFeePayments.find((entry) =>
                Number(entry.member_id) === memberId && entry.fee_id === fee.id && Number(entry.year) === year
              );
              return { ...fee, paid: payment?.paid === true, amount: Number(payment?.amount ?? fee.amount ?? 0) };
            });

          document.getElementById('monthlyRecordBody').innerHTML = monthly.length
            ? monthly.map((payment) => `
                <tr>
                  <td>${payment.month}</td>
                  <td>${window.TRMSUtils.formatMoneyShort(payment.amount || 0)}</td>
                  <td><span class="status ${payment.paid ? 'active' : 'inactive'}">${payment.paid ? 'Paid' : 'Unpaid'}</span></td>
                </tr>
              `).join('')
            : '<tr><td colspan="3">No monthly due records found.</td></tr>';

          document.getElementById('additionalRecordBody').innerHTML = additional.length
            ? additional.map((fee) => `
                  <tr>
                    <td>${fee.name}</td>
                    <td>${window.TRMSUtils.formatMoneyShort(fee.amount)}</td>
                    <td><span class="status ${fee.paid ? 'active' : 'inactive'}">${fee.paid ? 'Paid' : 'Unpaid'}</span></td>
                  </tr>
                `).join('')
            : '<tr><td colspan="3">No additional fee records found.</td></tr>';
        }

        yearSelect.addEventListener('change', renderRecord);
        document.getElementById('printReceipt').addEventListener('click', () => {
          const currentYear = new Date().getFullYear();
          const memberStartYear = Number(member.start_year);
          const availableYears = [
            ...(data.monthlyDueSettings || []).map((item) => Number(item.year)),
            ...(data.additionalFees || []).map((fee) => Number(fee.year)),
            ...(data.monthlyPayments || []).map((payment) => Number(payment.year)),
            ...(data.additionalFeePayments || []).map((payment) => Number(payment.year)),
            currentYear
          ].filter((year) => Number.isInteger(year) && year >= memberStartYear);
          const lastReceiptYear = Math.max(...availableYears, memberStartYear);
          const receiptYears = Array.from(
            { length: Math.max(lastReceiptYear - memberStartYear + 1, 1) },
            (_, index) => memberStartYear + index
          );
          let monthlyPaidAcrossYears = 0;
          let monthlyUnpaidAcrossYears = 0;
          let additionalPaidAcrossYears = 0;
          let additionalUnpaidAcrossYears = 0;

          const yearSections = receiptYears.map((year) => {
            const settings = (data.monthlyDueSettings || []).find((item) => Number(item.year) === year) || data.monthlyDue || {};
            const monthlyAmount = Number(settings.monthly_amount || 5);
            const yearlyDue = Number(settings.yearly_due || monthlyAmount * 12);
            const monthlyPayments = data.monthlyPayments.filter((payment) =>
              Number(payment.member_id) === memberId && Number(payment.year) === year
            );
            const totalYearPaid = monthlyPayments
              .filter((payment) => payment.paid)
              .reduce((sum, payment) => sum + Number(payment.amount || monthlyAmount), 0);
            const totalYearUnpaid = Math.max(yearlyDue - totalYearPaid, 0);
            const fees = data.additionalFees.filter((fee) => Number(fee.year) === year).map((fee) => {
              const payment = data.additionalFeePayments.find((entry) =>
                Number(entry.member_id) === memberId && entry.fee_id === fee.id && Number(entry.year) === year
              );
              const amount = Number(payment?.amount ?? fee.amount ?? 0);
              return { name: fee.name, amount, paid: payment?.paid === true };
            });
            const totalAdditionalFees = fees.reduce((sum, fee) => sum + fee.amount, 0);
            const additionalFeesPaid = fees.filter((fee) => fee.paid).reduce((sum, fee) => sum + fee.amount, 0);
            const additionalFeesUnpaid = totalAdditionalFees - additionalFeesPaid;
            monthlyPaidAcrossYears += totalYearPaid;
            monthlyUnpaidAcrossYears += totalYearUnpaid;
            additionalPaidAcrossYears += additionalFeesPaid;
            additionalUnpaidAcrossYears += additionalFeesUnpaid;

            return `
              <section class="year-section">
                <div class="year-title"><strong>${year}</strong><span>YEARLY SUMMARY</span></div>
                <div class="category">
                  <div class="category-title">Monthly Due</div>
                  <div class="summary-row"><span>Total Paid</span><strong>${window.TRMSUtils.formatMoneyShort(totalYearPaid)}</strong></div>
                  <div class="summary-row"><span>Total Unpaid</span><strong>${window.TRMSUtils.formatMoneyShort(totalYearUnpaid)}</strong></div>
                </div>
                <div class="separator"></div>
                <div class="category">
                  <div class="category-title">Additional Payments</div>
                  <div class="summary-row"><span>Total Paid</span><strong>${window.TRMSUtils.formatMoneyShort(additionalFeesPaid)}</strong></div>
                  <div class="summary-row"><span>Total Unpaid</span><strong>${window.TRMSUtils.formatMoneyShort(additionalFeesUnpaid)}</strong></div>
                </div>
              </section>
            `;
          }).join('');
          const currentUser = window.TRMSAuth.getCurrentUser();
          const adminProfile = data.profiles.find((profile) => profile.id === currentUser?.id && profile.role === 'admin');
          const zoneTreasurer = data.profiles.find((profile) =>
            profile.role === 'zone_treasurer' && Number(profile.zone_id) === Number(zoneId)
          );
          const datePrinted = new Date().toLocaleDateString('en-PH', {
            year: 'numeric', month: 'long', day: 'numeric'
          });
          const receiptWindow = window.open('', '_blank', 'width=900,height=700');

          if (!receiptWindow) {
            alert('Popup blocked. Please allow pop-ups to print the receipt.');
            return;
          }

          receiptWindow.document.write(`
            <html>
              <head>
                <title>Membership Payment Receipt</title>
                <style>
                  @page { size: A4 portrait; margin: 12mm; }
                  * { box-sizing: border-box; }
                  body { margin: 0; background: #fff; color: #222; font-family: Arial, Helvetica, sans-serif; font-size: 10.5px; line-height: 1.4; }
                  .receipt { width: 186mm; min-height: 273mm; margin: auto; }
                  h1, h2, h3, p { margin: 0; }
                  .header { display: flex; justify-content: space-between; align-items: flex-start; padding-bottom: 8px; border-bottom: 2px solid #222; }
                  .organization-brand { display: flex; align-items: center; gap: 8px; }
                  .organization-logo { width: 24mm; height: 24mm; object-fit: contain; }
                  .organization { font-size: 17px; font-weight: 700; letter-spacing: .5px; }
                  .organization-sub { font-size: 9px; color: #666; margin-top: 2px; }
                  .receipt-title { text-align: right; }
                  .receipt-title h1 { font-size: 18px; font-weight: 700; letter-spacing: .5px; }
                  .receipt-title p { margin-top: 2px; font-size: 9px; color: #666; }
                  .member-info { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 12px; padding: 10px 0; border-bottom: 1px solid #ccc; }
                  .info-label { display: block; font-size: 8px; color: #777; text-transform: uppercase; margin-bottom: 2px; }
                  .info-value { font-weight: 600; font-size: 10.5px; }
                  .year-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; margin-top: 12px; }
                  .year-section { border: 1px solid #d4d4d4; border-radius: 4px; padding: 8px 10px; break-inside: avoid; page-break-inside: avoid; }
                  .year-title { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #ddd; padding-bottom: 5px; margin-bottom: 6px; }
                  .year-title strong { font-size: 13px; }
                  .year-title span { font-size: 8px; color: #777; }
                  .category { margin-top: 5px; }
                  .category-title { font-size: 9px; font-weight: 700; text-transform: uppercase; color: #555; margin-bottom: 3px; }
                  .summary-row { display: flex; justify-content: space-between; padding: 2px 0; font-size: 9.5px; }
                  .summary-row strong { font-weight: 600; }
                  .separator { border-top: 1px dashed #bbb; margin: 6px 0; }
                  .grand-total { margin-top: 13px; border: 1.5px solid #222; border-radius: 5px; padding: 10px 14px; break-inside: avoid; page-break-inside: avoid; }
                  .grand-title { font-size: 12px; font-weight: 700; text-transform: uppercase; margin-bottom: 7px; padding-bottom: 5px; border-bottom: 1px solid #ccc; }
                  .grand-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
                  .grand-item-title { font-size: 9px; font-weight: 700; color: #555; margin-bottom: 3px; text-transform: uppercase; }
                  .grand-row { display: flex; justify-content: space-between; font-size: 10px; padding: 2px 0; }
                  .total-paid { margin-top: 8px; padding-top: 7px; border-top: 1.5px solid #222; display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; }
                  .footer-note { text-align: center; margin-top: 13px; font-size: 9px; color: #666; }
                  .signatures { display: grid; grid-template-columns: 1fr 1fr; gap: 35mm; margin-top: 18mm; text-align: center; break-inside: avoid; page-break-inside: avoid; }
                  .signature-line { border-top: 1px solid #222; margin-bottom: 4px; }
                  .signature-name { font-size: 10px; font-weight: 600; }
                  .signature-role { font-size: 8px; color: #666; margin-top: 1px; }
                  .print-date { text-align: right; margin-top: 8px; font-size: 8px; color: #777; }
                  @media print { body { background: #fff; } .receipt { width: 186mm; min-height: 273mm; } .year-section, .grand-total, .signatures { break-inside: avoid; page-break-inside: avoid; } }
                </style>
              </head>
              <body>
                <main class="receipt">
                  <header class="header">
                    <div class="organization-brand">
                      <img class="organization-logo" src="${logoUrl}" alt="TRMS logo" />
                      <div>
                      <div class="organization">SFAYA TREASURER</div>
                      <div class="organization-sub">Membership &amp; Community Contributions</div>
                      </div>
                    </div>
                    <div class="receipt-title"><h1>PAYMENT RECEIPT</h1><p>Official Record</p></div>
                  </header>
                  <section class="member-info">
                    <div><span class="info-label">Member</span><span class="info-value">${member.name}</span></div>
                    <div><span class="info-label">Zone</span><span class="info-value">${zone ? zone.name : 'Unknown'}</span></div>
                    <div><span class="info-label">Start Year</span><span class="info-value">${member.start_year}</span></div>
                  </section>
                  <section class="year-grid">${yearSections}</section>
                  <section class="grand-total">
                    <div class="grand-title">Overall Payment Summary</div>
                    <div class="grand-grid">
                      <div><div class="grand-item-title">Monthly Due</div><div class="grand-row"><span>Total Paid</span><strong>${window.TRMSUtils.formatMoneyShort(monthlyPaidAcrossYears)}</strong></div><div class="grand-row"><span>Total Unpaid</span><strong>${window.TRMSUtils.formatMoneyShort(monthlyUnpaidAcrossYears)}</strong></div></div>
                      <div><div class="grand-item-title">Additional Payments</div><div class="grand-row"><span>Total Paid</span><strong>${window.TRMSUtils.formatMoneyShort(additionalPaidAcrossYears)}</strong></div><div class="grand-row"><span>Total Unpaid</span><strong>${window.TRMSUtils.formatMoneyShort(additionalUnpaidAcrossYears)}</strong></div></div>
                    </div>
                    <div class="total-paid"><span>TOTAL PAID ALL YEARS</span><span>${window.TRMSUtils.formatMoneyShort(monthlyPaidAcrossYears + additionalPaidAcrossYears)}</span></div>
                  </section>
                  <div class="footer-note">Thank you for your contribution and continued support.</div>
                  <div class="signatures">
                    <div><div class="signature-line"></div><div class="signature-name">${zoneTreasurer?.name || 'Zone Treasurer'}</div><div class="signature-role">Zone Treasurer</div></div>
                    <div><div class="signature-line"></div><div class="signature-name">${adminProfile?.name || currentUser?.name || 'Head Treasurer'}</div><div class="signature-role">Head Treasurer</div></div>
                  </div>
                  <div class="print-date">Printed: ${datePrinted}</div>
                </main>
              </body>
            </html>
          `);
          receiptWindow.document.close();
          receiptWindow.focus();
          receiptWindow.print();
        });

        renderRecord();
      });
    </script>
  </body>
</html>
