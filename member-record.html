<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Member Record</title>
    <link rel="stylesheet" href="css/style.css?v=20260916-6" />
  </head>
  <body data-role="admin" class="app-shell record-page">
    <header class="topbar">
      <div class="brand">TRMS</div>
      <div class="topbar-meta">
        <span class="user-chip" data-user-name>Head Treasurer</span>
        <button class="btn btn-secondary" data-logout>Logout</button>
      </div>
    </header>

    <div class="layout">
      <aside class="sidebar">
        <div class="sidebar-brand" aria-label="TRMS brand">
          <img class="sidebar-brand__img" src="assets/logo.png" alt="TRMS logo" />
          <span class="sidebar-brand__text">TRMS</span>
        </div>
        <ul class="nav-list">
          <li><a href="admin-dashboard.html">Dashboard</a></li>
          <li><a class="active" href="zones.html">Zone List</a></li>
          <li><a href="create-zone.html">Create Zone</a></li>
          <li><a href="members.html">Members</a></li>
          <li><a href="treasurers.html">Zone Treasurers</a></li>
          <li><a href="monthly-due.html">Monthly Due</a></li>
          <li><a href="additional-fees.html">Additional Fees</a></li>
          <li><a href="payment-records.html">Payment Records</a></li>
          <li><a href="reports.html">Reports</a></li>
        </ul>
      </aside>

      <main class="content">
        <div class="page-header page-header--split">
          <div>
            <p class="eyebrow record-label">Member Record</p>
            <h1 id="memberName">Member</h1>
            <p id="memberMeta">-</p>
          </div>
          <div class="record-actions no-print">
            <a href="zones.html" class="btn btn-secondary">Back to Zone List</a>
            <div class="record-filters">
              <label for="recordYear">Year</label>
              <select id="recordYear"></select>
              <button type="button" class="btn btn-primary print-record-button" id="printReceipt">Print Receipt</button>
            </div>
          </div>
        </div>

        <section class="card record-block">
          <h2>Monthly Due</h2>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Month</th>
                  <th>Amount</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody id="monthlyRecordBody"></tbody>
            </table>
          </div>
        </section>

        <section class="card record-block card-spaced-top">
          <h2>Additional Fees</h2>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Fee</th>
                  <th>Amount</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody id="additionalRecordBody"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <script src="js/config.js"></script>
    <script src="js/auth.js?v=20260917-3"></script>
    <script src="js/utils.js"></script>
    <script src="js/guard.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', async () => {
        await window.TRMSAuth.ready();

        const params = new URLSearchParams(window.location.search);
        const memberId = Number(params.get('memberId'));
        const zoneId = Number(params.get('zoneId') || 1);
        const yearSelect = document.getElementById('recordYear');
        const requestedYear = Number(params.get('year')) || new Date().getFullYear();
        const data = window.TRMSAuth.getMockData();
        const member = data.members.find((item) => Number(item.id) === memberId);
        const zone = data.zones.find((item) => Number(item.id) === zoneId);
        const recordYears = [...new Set((data.monthlyDueSettings || [])
          .map((setting) => Number(setting.year))
          .filter((year) => Number.isInteger(year)))].sort((first, second) => second - first);
        yearSelect.innerHTML = recordYears.length
          ? recordYears.map((year) => `<option value="${year}">${year}</option>`).join('')
          : '<option value="" disabled selected>Monthly Due Not Created</option>';
        yearSelect.disabled = recordYears.length === 0;

        if (!member) {
          document.getElementById('memberName').textContent = 'Member record not found';
          return;
        }

        if (recordYears.includes(requestedYear)) yearSelect.value = String(requestedYear);
        document.getElementById('memberName').textContent = member.name;
        document.getElementById('memberMeta').textContent = `${zone ? zone.name : 'Zone'} - ${member.address || 'No address provided'} - ${member.phone || 'No phone number'}`;

        function renderRecord() {
          const year = Number(yearSelect.value);
          const monthly = data.monthlyPayments.filter((payment) =>
            Number(payment.member_id) === memberId && Number(payment.year) === year
          );
          const additional = data.additionalFees
            .filter((fee) => Number(fee.year) === year)
            .map((fee) => {
              const payment = data.additionalFeePayments.find((entry) =>
                Number(entry.member_id) === memberId && entry.fee_id === fee.id && Number(entry.year) === year
              );
              return { ...fee, paid: payment?.paid === true, amount: Number(payment?.amount ?? fee.amount ?? 0) };
            });

          document.getElementById('monthlyRecordBody').innerHTML = monthly.length
            ? monthly.map((payment) => `
                <tr>
                  <td>${payment.month}</td>
                  <td>${window.TRMSUtils.formatMoneyShort(payment.amount || 0)}</td>
                  <td><span class="status ${payment.paid ? 'active' : 'inactive'}">${payment.paid ? 'Paid' : 'Unpaid'}</span></td>
                </tr>
              `).join('')
            : '<tr><td colspan="3">No monthly due records found.</td></tr>';

          document.getElementById('additionalRecordBody').innerHTML = additional.length
            ? additional.map((fee) => `
                  <tr>
                    <td>${fee.name}</td>
                    <td>${window.TRMSUtils.formatMoneyShort(fee.amount)}</td>
                    <td><span class="status ${fee.paid ? 'active' : 'inactive'}">${fee.paid ? 'Paid' : 'Unpaid'}</span></td>
                  </tr>
                `).join('')
            : '<tr><td colspan="3">No additional fee records found.</td></tr>';
        }

        yearSelect.addEventListener('change', renderRecord);
        document.getElementById('printReceipt').addEventListener('click', () => {
          const currentYear = new Date().getFullYear();
          const memberStartYear = Number(member.start_year);
          const availableYears = [
            ...(data.monthlyDueSettings || []).map((item) => Number(item.year)),
            ...(data.additionalFees || []).map((fee) => Number(fee.year)),
            ...(data.monthlyPayments || []).map((payment) => Number(payment.year)),
            ...(data.additionalFeePayments || []).map((payment) => Number(payment.year)),
            currentYear
          ].filter((year) => Number.isInteger(year) && year >= memberStartYear);
          const lastReceiptYear = Math.max(...availableYears, memberStartYear);
          const receiptYears = Array.from(
            { length: Math.max(lastReceiptYear - memberStartYear + 1, 1) },
            (_, index) => memberStartYear + index
          );
          let monthlyPaidAcrossYears = 0;
          let monthlyUnpaidAcrossYears = 0;
          let additionalPaidAcrossYears = 0;
          let additionalUnpaidAcrossYears = 0;

          const yearSections = receiptYears.map((year) => {
            const settings = (data.monthlyDueSettings || []).find((item) => Number(item.year) === year) || data.monthlyDue || {};
            const monthlyAmount = Number(settings.monthly_amount || 5);
            const yearlyDue = Number(settings.yearly_due || monthlyAmount * 12);
            const monthlyPayments = data.monthlyPayments.filter((payment) =>
              Number(payment.member_id) === memberId && Number(payment.year) === year
            );
            const totalYearPaid = monthlyPayments
              .filter((payment) => payment.paid)
              .reduce((sum, payment) => sum + Number(payment.amount || monthlyAmount), 0);
            const totalYearUnpaid = Math.max(yearlyDue - totalYearPaid, 0);
            const fees = data.additionalFees.filter((fee) => Number(fee.year) === year).map((fee) => {
              const payment = data.additionalFeePayments.find((entry) =>
                Number(entry.member_id) === memberId && entry.fee_id === fee.id && Number(entry.year) === year
              );
              const amount = Number(payment?.amount ?? fee.amount ?? 0);
              return { name: fee.name, amount, paid: payment?.paid === true };
            });
            const totalAdditionalFees = fees.reduce((sum, fee) => sum + fee.amount, 0);
            const additionalFeesPaid = fees.filter((fee) => fee.paid).reduce((sum, fee) => sum + fee.amount, 0);
            const additionalFeesUnpaid = totalAdditionalFees - additionalFeesPaid;
            monthlyPaidAcrossYears += totalYearPaid;
            monthlyUnpaidAcrossYears += totalYearUnpaid;
            additionalPaidAcrossYears += additionalFeesPaid;
            additionalUnpaidAcrossYears += additionalFeesUnpaid;

            return `
              <section class="year-section">
                <div class="separator">${year}</div>
                <div class="separator">-----------------------------------------------</div>
                <h3>MONTHLY DUE</h3>
                <div class="summary-row"><span>Total Paid</span><strong>${window.TRMSUtils.formatMoneyShort(totalYearPaid)}</strong></div>
                <div class="summary-row"><span>Total Unpaid</span><strong>${window.TRMSUtils.formatMoneyShort(totalYearUnpaid)}</strong></div>
                <h3>ADDITIONAL PAYMENTS</h3>
                <div class="summary-row"><span>Total Paid</span><strong>${window.TRMSUtils.formatMoneyShort(additionalFeesPaid)}</strong></div>
                <div class="summary-row"><span>Total Unpaid</span><strong>${window.TRMSUtils.formatMoneyShort(additionalFeesUnpaid)}</strong></div>
                <div class="separator">-----------------------------------------------</div>
              </section>
            `;
          }).join('');
          const currentUser = window.TRMSAuth.getCurrentUser();
          const adminProfile = data.profiles.find((profile) => profile.id === currentUser?.id && profile.role === 'admin');
          const zoneTreasurer = data.profiles.find((profile) =>
            profile.role === 'zone_treasurer' && Number(profile.zone_id) === Number(zoneId)
          );
          const datePrinted = new Date().toLocaleDateString('en-PH', {
            year: 'numeric', month: 'long', day: 'numeric'
          });
          const receiptWindow = window.open('', '_blank', 'width=900,height=700');

          if (!receiptWindow) {
            alert('Popup blocked. Please allow pop-ups to print the receipt.');
            return;
          }

          receiptWindow.document.write(`
            <html>
              <head>
                <title>Membership Payment Receipt</title>
                <style>
                  @page { size: A4 portrait; margin: 12mm; }
                  html, body { width: auto; min-height: 273mm; }
                  body { box-sizing: border-box; margin: 0; color: #111; background: #fff; font-family: "Courier New", Courier, monospace; font-size: 12px; line-height: 1.35; }
                  .receipt { min-height: 273mm; }
                  h1, h2, h3, p { margin: 0; }
                  h1 { font-size: 18px; line-height: 1.2; text-align: center; letter-spacing: 1px; }
                  h2 { font-size: 16px; margin: 12px 0 6px; text-align: center; }
                  h3 { font-size: 13px; margin: 10px 0 4px; }
                  .separator { white-space: pre; overflow: hidden; margin: 5px 0; }
                  .receipt-title { text-align: center; margin-bottom: 8px; }
                  .details { margin: 10px 0; }
                  .detail-row, .summary-row { display: flex; justify-content: space-between; gap: 20px; }
                  .detail-label { min-width: 72px; }
                  .summary-row { padding-left: 12px; }
                  .summary-row strong { text-align: right; white-space: nowrap; }
                  .year-section { page-break-inside: avoid; }
                  .grand-total { page-break-inside: avoid; margin-top: 14px; }
                  .thank-you { text-align: center; margin: 18px 0; }
                  .signatures { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; margin-top: 22px; text-align: center; }
                  .signature-line { border-top: 1px solid #111; margin-bottom: 4px; }
                  .signature-name { font-weight: 600; }
                  .date { margin-top: 12px; text-align: right; }
                  @media print { .receipt { min-height: 273mm; } }
                </style>
              </head>
              <body>
                <main class="receipt">
                  <div class="separator">===============================================</div>
                  <div class="receipt-title"><h1>SFAYA TREASURER</h1><h1>PAYMENT RECEIPT</h1></div>
                  <div class="separator">===============================================</div>
                  <div class="details">
                    <div class="detail-row"><span><span class="detail-label">MEMBER :</span> ${member.name}</span></div>
                    <div class="detail-row"><span><span class="detail-label">ZONE   :</span> ${zone ? zone.name : 'Unknown'}</span></div>
                    <div class="detail-row"><span><span class="detail-label">START  :</span> ${member.start_year}</span></div>
                    <div class="detail-row"><span><span class="detail-label">DATE   :</span> ${datePrinted}</span></div>
                  </div>
                  <div class="separator">-----------------------------------------------</div>

                  ${yearSections}

                  <div class="grand-total">
                    <div class="separator">===============================================</div>
                    <h2>GRAND TOTAL</h2>
                    <div class="separator">===============================================</div>
                  <h3>MONTHLY DUE</h3>
                    <div class="summary-row"><span>TOTAL PAID</span><strong>${window.TRMSUtils.formatMoneyShort(monthlyPaidAcrossYears)}</strong></div>
                    <div class="summary-row"><span>TOTAL UNPAID</span><strong>${window.TRMSUtils.formatMoneyShort(monthlyUnpaidAcrossYears)}</strong></div>
                  <h3>ADDITIONAL PAYMENTS</h3>
                    <div class="summary-row"><span>TOTAL PAID</span><strong>${window.TRMSUtils.formatMoneyShort(additionalPaidAcrossYears)}</strong></div>
                    <div class="summary-row"><span>TOTAL UNPAID</span><strong>${window.TRMSUtils.formatMoneyShort(additionalUnpaidAcrossYears)}</strong></div>
                    <div class="separator">-----------------------------------------------</div>
                    <div class="summary-row"><span>TOTAL PAID ALL YEARS</span><strong>${window.TRMSUtils.formatMoneyShort(monthlyPaidAcrossYears + additionalPaidAcrossYears)}</strong></div>
                    <div class="separator">===============================================</div>
                  </div>

                  <p class="thank-you">Thank you for your payment!</p>
                  <div class="signatures">
                    <div><div class="signature-line"></div><div class="signature-name">${zoneTreasurer?.name || 'Zone Treasurer'}</div><div>ZONE TREASURER</div></div>
                    <div><div class="signature-line"></div><div class="signature-name">${adminProfile?.name || currentUser?.name || 'Head Treasurer'}</div><div>HEAD TREASURER</div></div>
                  </div>
                </main>
              </body>
            </html>
          `);
          receiptWindow.document.close();
          receiptWindow.focus();
          receiptWindow.print();
        });

        renderRecord();
      });
    </script>
  </body>
</html>
