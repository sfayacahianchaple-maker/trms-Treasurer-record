<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payment Management</title>
    <link rel="icon" type="image/png" href="assets/logo.png" />
    <link rel="stylesheet" href="css/style.css?v=20260917-7" />
    <script src="js/admin-navigation.js" defer></script>
  </head>
  <body class="app-shell">
    <header class="topbar">
      <div class="brand">TRMS</div>
      <div class="topbar-meta">
        <span class="user-chip" data-user-name>Zone Treasurer</span>
        <button class="btn btn-secondary" data-logout>Logout</button>
      </div>
    </header>

    <div class="layout">
      <aside class="sidebar">
        <div class="sidebar-brand" aria-label="TRMS brand">
          <img class="sidebar-brand__img" src="assets/logo.png" alt="TRMS logo" />
          <span class="sidebar-brand__text">TRMS</span>
        </div>
        <ul class="nav-list" id="paymentNavigation"></ul>
      </aside>

      <main class="content">
        <div class="page-header">
          <h1>Payment Management</h1>
        </div>

        <section class="card">
          <div class="zone-header">
            <h2>Monthly Due</h2>
            <div class="inline-controls">
              <label for="yearSelect">Year</label>
              <select id="yearSelect"></select>
            </div>
          </div>

          <div class="inline-controls payment-member-search">
            <input id="memberSearch" type="search" placeholder="Search member..." />
            <span id="paymentSaveStatus" class="save-status" role="status" aria-live="polite"></span>
          </div>

          <div class="table-wrap payment-table-wrap">
            <table>
              <thead id="paymentTableHead"></thead>
              <tbody id="treasurerTableBody"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <script src="js/config.js"></script>
    <script src="js/auth.js?v=20261018-3"></script>
    <script src="js/utils.js?v=20260925-1"></script>
    <script src="js/guard.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', async () => {
        await window.TRMSAuth.ready();
        const user = window.TRMSAuth.getCurrentUser();
        if (!['admin', 'zone_treasurer'].includes(user?.role)) {
          window.location.href = 'login.html';
          return;
        }
        const isAdmin = user.role === 'admin';
        const zoneId = user?.zone_id;
        let data = window.TRMSAuth.getMockData();
        const memberList = isAdmin
          ? data.members.filter((member) => member.archived_at == null)
          : data.members.filter((member) => member.archived_at == null && Number(member.zone_id) === Number(zoneId));
        document.getElementById('paymentNavigation').innerHTML = isAdmin
          ? `
              <li><a href="admin-dashboard.html">Dashboard</a></li>
              <li><a href="zones.html">Zone List</a></li>
              <li><a href="create-zone.html">Create Zone</a></li>
              <li><a href="members.html">Members</a></li>
              <li><a href="archives.html">Archives</a></li>
              <li><a href="treasurers.html">Zone Treasurers</a></li>
              <li><a href="monthly-due.html">Monthly Due</a></li>
              <li><a href="additional-fees.html">Additional Fees</a></li>
              <li><a href="wedding-fees.html">Wedding Fees</a></li>
              <li><a class="active" href="treasurer-payments.html">Payment Management</a></li>
              <li><a href="payment-records.html">Payment Records</a></li>
              <li><a href="reports.html">Reports</a></li>
            `
          : `
              <li><a href="treasurer-dashboard.html">Dashboard</a></li>
              <li><a href="treasurer-members.html">My Members</a></li>
              <li><a class="active" href="treasurer-payments.html">Payment Management</a></li>
            `;
        const yearSelect = document.getElementById('yearSelect');
        const memberSearch = document.getElementById('memberSearch');
        const tableBody = document.getElementById('treasurerTableBody');
        const tableHead = document.getElementById('paymentTableHead');
        const months = window.TRMSUtils.monthNames();

        function populateYearOptions() {
          const years = [...new Set([
            ...(data.monthlyDueSettings || []).map((setting) => Number(setting.year)),
            ...(data.weddingFees || []).map((fee) => Number(fee.year))
          ]
            .filter((year) => Number.isInteger(year)))]
            .sort((first, second) => second - first);
          yearSelect.innerHTML = years.length
            ? years.map((year) => `<option value="${year}">${year}</option>`).join('')
            : '<option value="" disabled selected>Monthly Due Not Created</option>';
          yearSelect.disabled = years.length === 0;
        }

        function renderHeader(year) {
          const monthlyDue = (data.monthlyDueSettings || []).find((setting) => Number(setting.year) === Number(year));
          const feeColumns = data.additionalFees.filter((fee) => Number(fee.year) === Number(year));
          const hasWeddingFees = (data.weddingFees || []).some((fee) => Number(fee.year) === Number(year));
          const feeHeaders = feeColumns.map((fee) => `
            <th>
              ${fee.name}<br>
              <small>${window.TRMSUtils.formatMoneyShort(fee.amount)}</small>
            </th>
          `).join('');

          tableHead.innerHTML = `
            <tr>
              <th>#</th>
              <th>Member</th>
              ${isAdmin ? '<th>Zone</th>' : ''}
              <th>Status</th>
              ${monthlyDue ? months.map((month) => `<th>${month}</th>`).join('') : '<th>Monthly Due</th>'}
              ${feeHeaders || '<th>Fees</th>'}
              ${hasWeddingFees ? '<th>Wedding Fee</th>' : ''}
            </tr>
          `;
        }

        function renderTable() {
          const year = Number(yearSelect.value);
          const query = memberSearch.value.trim().toLowerCase();
          const filteredMembers = memberList
            .filter((member) => window.TRMSUtils.memberStartedByYear(member, year))
            .filter((member) => !query || member.name.toLowerCase().includes(query));
          const monthlyDue = (data.monthlyDueSettings || []).find((setting) => Number(setting.year) === Number(year));
          const feeColumns = data.additionalFees.filter((fee) => Number(fee.year) === Number(year));
          const weddingFeeRows = (data.weddingFees || []).filter((fee) => Number(fee.year) === year);

          renderHeader(year);

          tableBody.innerHTML = filteredMembers.map((member, index) => {
            const status = window.TRMSUtils.calculateMemberStatus(member.id, year);
            const zone = data.zones.find((item) => Number(item.id) === Number(member.zone_id));
            const paidMonths = data.monthlyPayments.filter((payment) => Number(payment.member_id) === Number(member.id) && Number(payment.year) === year);
            const monthlyCells = monthlyDue
              ? months.map((month) => {
                  const match = paidMonths.find((payment) => payment.month === month);
                  const checked = match?.paid === true;
                  return `<td class="checkbox-cell"><label class="payment-toggle"><input type="checkbox" ${checked ? 'checked' : ''} aria-label="${member.name} ${month}" data-member-id="${member.id}" data-month="${month}" data-year="${year}" /><span class="payment-box" aria-hidden="true"></span></label></td>`;
                }).join('')
              : '<td class="payment-unavailable">Monthly Due Not Created</td>';

            const feeCells = feeColumns.length
              ? feeColumns.map((fee) => {
                  const feePayment = data.additionalFeePayments.find((payment) => Number(payment.member_id) === Number(member.id) && payment.fee_id === fee.id && Number(payment.year) === year);
                  const isChecked = feePayment && feePayment.paid;
                  return `<td class="checkbox-cell"><label class="payment-toggle"><input type="checkbox" ${isChecked ? 'checked' : ''} aria-label="${member.name} ${fee.name}" data-member-id="${member.id}" data-fee-id="${fee.id}" data-year="${year}" /><span class="payment-box" aria-hidden="true"></span></label></td>`;
                }).join('')
              : '<td>—</td>';
              const weddingFee = weddingFeeRows.find((fee) => Number(fee.member_id) === Number(member.id));
              const weddingFeeCell = weddingFeeRows.length
                ? weddingFee
                  ? `<td class="checkbox-cell"><div class="wedding-payment-cell"><label class="payment-toggle"><input type="checkbox" ${weddingFee.paid ? 'checked' : ''} aria-label="${member.name} Wedding Fee ${window.TRMSUtils.formatMoneyShort(weddingFee.amount)}" data-member-id="${member.id}" data-wedding-fee-id="${weddingFee.id}" data-year="${year}" /><span class="payment-box" aria-hidden="true"></span></label><span>${window.TRMSUtils.formatMoneyShort(weddingFee.amount)}</span></div></td>`
                  : '<td class="payment-unavailable">—</td>'
                : '';

            return `
              <tr>
                <td>${index + 1}</td>
                <td>${member.name}</td>
                ${isAdmin ? `<td>${zone ? zone.name : 'Unknown'}</td>` : ''}
                <td><span class="${status.className}">${status.label}</span></td>
                ${monthlyCells}
                ${feeCells}
                ${weddingFeeCell}
              </tr>
            `;
          }).join('');

          tableBody.querySelectorAll('input[type="checkbox"]').forEach((checkbox) => {
            checkbox.addEventListener('change', async (event) => {
              const target = event.target;
              const saveStatus = document.getElementById('paymentSaveStatus');
              const memberId = Number(target.dataset.memberId);
              const year = Number(target.dataset.year);
              const dataSet = window.TRMSAuth.getMockData();
              const previousChecked = !target.checked;
              let result;
              target.disabled = true;
              target.closest('.payment-toggle').classList.add('is-saving');
              saveStatus.className = 'save-status is-saving';
              saveStatus.textContent = 'Saving payment...';

              if (target.dataset.weddingFeeId) {
                result = await window.TRMSAuth.saveWeddingFeePayment(target.dataset.weddingFeeId, target.checked);
              } else if (target.dataset.feeId) {
                const feeId = target.dataset.feeId;
                const paymentMatch = dataSet.additionalFeePayments.find((item) => Number(item.member_id) === memberId && item.fee_id === feeId && Number(item.year) === year);

                const fee = dataSet.additionalFees.find((item) => item.id === feeId);
                if (paymentMatch) {
                  paymentMatch.paid = target.checked;
                } else if (fee) {
                  dataSet.additionalFeePayments.push({ member_id: memberId, fee_id: feeId, year, paid: target.checked, amount: fee.amount });
                }

                result = await window.TRMSAuth.saveAdditionalFeePayment({
                  member_id: memberId,
                  fee_id: feeId,
                  year,
                  paid: target.checked,
                  amount: fee?.amount || paymentMatch?.amount || 0
                });
              } else {
                const month = target.dataset.month;
                const paymentMatch = dataSet.monthlyPayments.find((item) => Number(item.member_id) === memberId && item.month === month && Number(item.year) === year);

                if (paymentMatch) {
                  paymentMatch.paid = target.checked;
                } else {
                  dataSet.monthlyPayments.push({ member_id: memberId, year, month, paid: target.checked, amount: 5 });
                }

                result = await window.TRMSAuth.saveMonthlyPayment({
                  member_id: memberId,
                  year,
                  month,
                  paid: target.checked,
                  amount: paymentMatch?.amount || dataSet.monthlyDue.monthly_amount || 5
                });
              }

              if (!result.success) {
                target.checked = previousChecked;
                target.disabled = false;
                target.closest('.payment-toggle').classList.remove('is-saving');
                saveStatus.className = 'save-status is-error';
                saveStatus.textContent = result.message;
                alert(result.message);
                return;
              }

              data = window.TRMSAuth.getMockData();
              renderTable();
              saveStatus.className = 'save-status is-success';
              saveStatus.textContent = 'Payment saved.';
              window.setTimeout(() => {
                saveStatus.textContent = '';
                saveStatus.className = 'save-status';
              }, 1800);
            });
          });
        }

        yearSelect.addEventListener('change', renderTable);
        memberSearch.addEventListener('input', renderTable);
        populateYearOptions();
        renderTable();
      });
    </script>
  </body>
</html>
