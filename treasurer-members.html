<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Members</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-role="zone_treasurer" class="app-shell">
    <header class="topbar">
      <div class="brand">TRMS</div>
      <div class="topbar-meta">
        <span class="user-chip" data-user-name>Zone Treasurer</span>
        <button class="btn btn-secondary" data-logout>Logout</button>
      </div>
    </header>

    <div class="layout">
      <aside class="sidebar">
        <ul class="nav-list">
          <li><a href="treasurer-dashboard.html">Dashboard</a></li>
          <li><a class="active" href="treasurer-members.html">My Members</a></li>
          <li><a href="treasurer-payments.html">Payment Management</a></li>
        </ul>
      </aside>

      <main class="content">
        <div class="page-header">
          <h1>My Members</h1>
        </div>

        <section class="card">
          <div class="zone-header">
            <div>
              <p><strong>Assigned Zone:</strong> <span id="assignedZoneLabel">-</span></p>
              <p><strong>Total Members:</strong> <span id="totalMembers">0</span></p>
              <p><strong>Active Members:</strong> <span id="activeMembers">0</span></p>
              <p><strong>Inactive Members:</strong> <span id="inactiveMembers">0</span></p>
            </div>
            <div class="inline-controls">
              <label for="memberYearSelect">Year</label>
              <select id="memberYearSelect"></select>
            </div>
          </div>

          <div class="grid metrics-grid member-payment-summary" id="memberPaymentSummary"></div>

          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>#</th>
                  <th>Member</th>
                  <th>Status</th>
                  <th>Monthly Due Paid</th>
                  <th>Monthly Due Unpaid</th>
                  <th>Additional Fee Paid</th>
                  <th>Additional Fee Unpaid</th>
                </tr>
              </thead>
              <tbody id="memberTableBody"></tbody>
            </table>
          </div>
        </section>

      </main>
    </div>

    <script src="js/config.js"></script>
    <script src="js/auth.js?v=20260917-8"></script>
    <script src="js/utils.js?v=20260917-4"></script>
    <script src="js/guard.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', async () => {
        await window.TRMSAuth.ready();
        const user = window.TRMSAuth.getCurrentUser();
        const zoneId = user?.zone_id;
        const data = window.TRMSAuth.getMockData();
        const zone = data.zones.find((item) => Number(item.id) === Number(zoneId)) || data.zones[0];
        const members = data.members.filter((member) => Number(member.zone_id) === Number(zone.id));
        const yearSelect = document.getElementById('memberYearSelect');
        const paymentSummary = document.getElementById('memberPaymentSummary');
        const memberYears = [...new Set((data.monthlyDueSettings || [])
          .map((setting) => Number(setting.year))
          .filter((year) => Number.isInteger(year)))].sort((first, second) => second - first);
        yearSelect.innerHTML = memberYears.length
          ? memberYears.map((year) => `<option value="${year}">${year}</option>`).join('')
          : '<option value="" disabled selected>Monthly Due Not Created</option>';
        yearSelect.disabled = memberYears.length === 0;

        document.getElementById('assignedZoneLabel').textContent = zone ? zone.name : 'Not assigned';
        document.getElementById('totalMembers').textContent = members.length;

        const tableBody = document.getElementById('memberTableBody');

        function renderMembers() {
          const year = Number(yearSelect.value);
          const activeCount = members.filter((member) => window.TRMSUtils.calculateMemberStatus(member.id, year).label === 'Active').length;
          document.getElementById('activeMembers').textContent = activeCount;
          document.getElementById('inactiveMembers').textContent = members.length - activeCount;
          const summary = { monthlyPaid: 0, monthlyUnpaid: 0, feePaid: 0, feeUnpaid: 0 };
          tableBody.innerHTML = members.map((member, index) => {
            const status = window.TRMSUtils.calculateMemberStatus(member.id, year);
            const totalPaid = data.monthlyPayments
              .filter((payment) => Number(payment.member_id) === Number(member.id) && Number(payment.year) === year && payment.paid)
              .reduce((sum, payment) => sum + Number(payment.amount || 0), 0);
            const monthlySettings = (data.monthlyDueSettings || []).find((setting) => Number(setting.year) === year) || data.monthlyDue || {};
            const yearlyDue = Number(monthlySettings.yearly_due || (Number(monthlySettings.monthly_amount || 0) * 12));
            const annualMonthlyUnpaid = Math.max(yearlyDue - totalPaid, 0);
            const memberFees = data.additionalFees.filter((fee) => Number(fee.year) === year);
            const paidFeeTotal = memberFees
              .filter((fee) => data.additionalFeePayments.some((payment) => Number(payment.member_id) === Number(member.id) && payment.fee_id === fee.id && Number(payment.year) === year && payment.paid))
              .reduce((sum, fee) => sum + Number(fee.amount || 0), 0);
            const unpaidFeeTotal = memberFees
              .filter((fee) => !data.additionalFeePayments.some((payment) => Number(payment.member_id) === Number(member.id) && payment.fee_id === fee.id && Number(payment.year) === year && payment.paid))
              .reduce((sum, fee) => sum + Number(fee.amount || 0), 0);
            summary.monthlyPaid += totalPaid;
            summary.monthlyUnpaid += annualMonthlyUnpaid;
            summary.feePaid += paidFeeTotal;
            summary.feeUnpaid += unpaidFeeTotal;

            return `
              <tr>
                <td>${index + 1}</td>
                <td>${member.name}</td>
                <td><span class="${status.className}">${status.label}</span></td>
                <td><span class="money-badge paid-badge">${window.TRMSUtils.formatMoneyShort(totalPaid)}</span></td>
                <td><span class="money-badge unpaid-badge">${window.TRMSUtils.formatMoneyShort(annualMonthlyUnpaid)}</span></td>
                <td><span class="money-badge paid-badge">${window.TRMSUtils.formatMoneyShort(paidFeeTotal)}</span></td>
                <td><span class="money-badge unpaid-badge">${window.TRMSUtils.formatMoneyShort(unpaidFeeTotal)}</span></td>
              </tr>
            `;
          }).join('');
          paymentSummary.innerHTML = [
            { label: 'Total Paid', value: summary.monthlyPaid + summary.feePaid, className: 'paid-summary' },
            { label: 'Total Unpaid', value: summary.monthlyUnpaid + summary.feeUnpaid, className: 'unpaid-summary' }
          ].map((item) => `
            <article class="card metric-card ${item.className}">
              <span class="label">${item.label}</span>
              <span class="value">${window.TRMSUtils.formatMoneyShort(item.value)}</span>
            </article>
          `).join('');
        }

        yearSelect.addEventListener('change', renderMembers);
        renderMembers();
      });
    </script>
  </body>
</html>
