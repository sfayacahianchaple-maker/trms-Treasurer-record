<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Additional Fees</title>
    <link rel="icon" type="image/png" href="assets/logo.png" />
    <link rel="stylesheet" href="css/style.css?v=20260917-3" />
  </head>
  <body data-role="admin" class="app-shell">
    <header class="topbar">
      <div class="brand">TRMS</div>
      <div class="topbar-meta">
        <span class="user-chip" data-user-name>Head Treasurer</span>
        <button class="btn btn-secondary" data-logout>Logout</button>
      </div>
    </header>

    <div class="layout">
      <aside class="sidebar">
        <div class="sidebar-brand" aria-label="TRMS brand">
          <img class="sidebar-brand__img" src="assets/logo.png" alt="TRMS logo" />
          <span class="sidebar-brand__text">TRMS</span>
        </div>
        <ul class="nav-list">
          <li><a href="admin-dashboard.html">Dashboard</a></li>
          <li><a href="zones.html">Zone List</a></li>
          <li><a href="create-zone.html">Create Zone</a></li>
          <li><a href="members.html">Members</a></li>
          <li><a href="treasurers.html">Zone Treasurers</a></li>
          <li><a href="monthly-due.html">Monthly Due</a></li>
          <li><a class="active" href="additional-fees.html">Additional Fees</a></li>
          <li><a href="payment-records.html">Payment Records</a></li>
          <li><a href="reports.html">Reports</a></li>
        </ul>
      </aside>

      <main class="content">
        <div class="page-header">
          <h1>Additional Fees</h1>
        </div>

        <section class="card">
          <div id="feeFormHost">
            <form id="addFeeForm" class="form-grid">
              <div class="form-control">
                <label for="feeName">Fee Name</label>
                <input id="feeName" type="text" placeholder="Special Contribution" required />
              </div>
              <div class="form-control">
                <label for="feeAmount">Amount</label>
                <input id="feeAmount" type="number" min="0" step="0.01" placeholder="0.00" required />
              </div>
              <div class="form-control">
                <label for="feeYear">Year</label>
                <input id="feeYear" type="number" value="2026" required />
              </div>
              <div class="form-control">
                <label for="feeDescription">Description</label>
                <input id="feeDescription" type="text" placeholder="Additional fee" />
              </div>
              <div class="button-group button-group-spaced form-actions-full">
                <button type="submit" class="btn btn-primary">Save</button>
              </div>
            </form>
          </div>
        </section>

        <section class="card card-spaced-top">
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Fee Name</th>
                  <th>Amount</th>
                  <th>Year</th>
                  <th>Description</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="feesTableBody"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <section class="modal-overlay" id="feeModal" hidden>
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="feeModalTitle">
        <div class="page-header">
          <div>
            <p class="eyebrow">Additional Fee</p>
            <h2 id="feeModalTitle">Add Additional Fee</h2>
          </div>
          <button type="button" class="modal-close" id="closeFeeModalBtn" aria-label="Close additional fee form">&times;</button>
        </div>
        <div id="editFeeFormHost"></div>
      </div>
    </section>

    <script src="js/config.js"></script>
    <script src="js/auth.js?v=20260926-2"></script>
    <script src="js/utils.js"></script>
    <script src="js/guard.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', async () => {
        await window.TRMSAuth.ready();
        const body = document.getElementById('feesTableBody');
        const addFeeForm = document.getElementById('addFeeForm');
        const feeModal = document.getElementById('feeModal');
        const feeFormHost = document.getElementById('feeFormHost');
        const editFeeFormHost = document.getElementById('editFeeFormHost');
        let editingFeeId = null;

        function closeFeeModal() {
          feeModal.hidden = true;
          feeFormHost.appendChild(addFeeForm);
          editingFeeId = null;
          addFeeForm.reset();
          document.getElementById('feeYear').value = new Date().getFullYear();
          addFeeForm.querySelector('[type="submit"]').textContent = 'Save';
          document.getElementById('feeModalTitle').textContent = 'Add Additional Fee';
        }

        function openFeeModal(fee) {
          editingFeeId = fee?.id || null;
          editFeeFormHost.appendChild(addFeeForm);
          document.getElementById('feeModalTitle').textContent = editingFeeId ? 'Edit Additional Fee' : 'Add Additional Fee';
          addFeeForm.querySelector('[type="submit"]').textContent = editingFeeId ? 'Update' : 'Save';
          if (fee) {
            document.getElementById('feeName').value = fee.name;
            document.getElementById('feeAmount').value = fee.amount;
            document.getElementById('feeYear').value = fee.year;
            document.getElementById('feeDescription').value = fee.description || '';
          }
          feeModal.hidden = false;
          document.getElementById('feeName').focus();
        }

        function renderFees() {
          const data = window.TRMSAuth.getMockData();
          body.innerHTML = data.additionalFees.map((fee) => `
            <tr>
              <td>${fee.name}</td>
              <td>${window.TRMSUtils.formatMoneyShort(fee.amount)}</td>
              <td>${fee.year}</td>
              <td>${fee.description || 'N/A'}</td>
              <td>
                <div class="button-group">
                  <button type="button" class="btn btn-secondary" data-edit-fee="${fee.id}">Edit</button>
                  <button type="button" class="btn btn-danger" data-delete-fee="${fee.id}">Delete</button>
                </div>
              </td>
            </tr>
          `).join('');
        }

        addFeeForm.addEventListener('submit', async (event) => {
          event.preventDefault();
          const name = document.getElementById('feeName').value.trim();
          const amount = Number(document.getElementById('feeAmount').value || 0);
          const year = Number(document.getElementById('feeYear').value || new Date().getFullYear());
          const description = document.getElementById('feeDescription').value.trim() || 'Additional fee';
          if (!name || amount < 0 || !year) return;

          const fee = {
            id: editingFeeId || `fee-${Date.now()}`,
            name: name.trim(),
            amount,
            year,
            description
          };

          const result = editingFeeId
            ? await window.TRMSAuth.updateAdditionalFee(editingFeeId, fee)
            : await window.TRMSAuth.createAdditionalFee(fee);
          if (!result.success) {
            alert(result.message);
            return;
          }

          addFeeForm.reset();
          document.getElementById('feeYear').value = new Date().getFullYear();
          editingFeeId = null;
          await window.TRMSAuth.ready();
          renderFees();
          closeFeeModal();
        });

        body.addEventListener('click', async (event) => {
          const editButton = event.target.closest('[data-edit-fee]');
          const deleteButton = event.target.closest('[data-delete-fee]');
          const feeId = editButton?.dataset.editFee || deleteButton?.dataset.deleteFee;
          if (!feeId) return;
          const fee = window.TRMSAuth.getMockData().additionalFees.find((item) => item.id === feeId);
          if (!fee) return;

          if (editButton) {
            openFeeModal(fee);
            return;
          }

          if (window.confirm(`Delete ${fee.name}?`)) {
            const result = await window.TRMSAuth.deleteAdditionalFee(feeId);
            if (!result.success) {
              alert(result.message);
              return;
            }
            if (editingFeeId === feeId) {
              closeFeeModal();
            }
            await window.TRMSAuth.ready();
            renderFees();
          }
        });

        document.getElementById('closeFeeModalBtn').addEventListener('click', closeFeeModal);
        feeModal.addEventListener('click', (event) => {
          if (event.target === feeModal) closeFeeModal();
        });

        renderFees();
      });
    </script>
  </body>
</html>
